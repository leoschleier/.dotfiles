# Hypridle configuration - lock screen and display power on idle
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock      # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session   # lock before suspending
    after_sleep_cmd = hyprctl dispatch dpms on # turn display back on after resume
}

# Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display 30s after locking
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 minutes (uncomment to enable)
