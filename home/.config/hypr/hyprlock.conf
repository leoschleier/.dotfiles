# Hyprlock configuration - Rose Pine colors
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(25, 23, 36, 1.0) # base
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(224, 222, 244, 1.0) # text
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = rgba(144, 140, 170, 1.0) # subtle
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(196, 167, 231, 1.0) # iris
    inner_color = rgba(31, 29, 46, 1.0)    # surface
    font_color = rgba(224, 222, 244, 1.0)  # text
    check_color = rgba(246, 193, 119, 1.0) # gold
    fail_color = rgba(235, 111, 146, 1.0)  # love
    fade_on_empty = true
    placeholder_text = <span foreground="##6e6a86">Password...</span>
    position = 0, -40
    halign = center
    valign = center
}
